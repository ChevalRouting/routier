version: "2"

sql:
  - engine: sqlite
    schema: pkg/db/migrations
    queries: pkg/db/query
    gen:
      go:
        package: generated
        out: pkg/db/generated
        sql_package: database/sql
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
