info:
  description: Configuration and monitoring API for a Routier node.
  title: Routier API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/announcements:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-array_types_Announcement'
          description: OK
      security:
      - BearerAuth: []
      summary: List all announcements
      tags:
      - announcements
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.Announcement'
              description: announcement
              summary: body
        description: announcement
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-types_Announcement'
          description: OK
      security:
      - BearerAuth: []
      summary: Create an announcement
      tags:
      - announcements
  /api/announcements/{id}:
    delete:
      parameters:
      - description: announcement id
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-types_StatusResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Delete an announcement
      tags:
      - announcements
    put:
      parameters:
      - description: announcement id
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.Announcement'
              description: announcement
              summary: body
        description: announcement
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-types_Announcement'
          description: OK
      security:
      - BearerAuth: []
      summary: Update an announcement
      tags:
      - announcements
  /api/announcements/active:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-array_types_Announcement'
          description: OK
      security:
      - BearerAuth: []
      summary: List enabled announcements (for the banner)
      tags:
      - announcements
  /api/apply/confirm:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-types_StatusResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Confirm (keep) a pending apply
      tags:
      - apply
  /api/apply/logs:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-types_ApplyLogsResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: List apply-history records
      tags:
      - apply
  /api/apply/logs/{id}:
    get:
      parameters:
      - description: apply log id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: OK
      security:
      - BearerAuth: []
      summary: Read one apply log
      tags:
      - apply
  /api/apply/pending:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-types_ApplyPendingResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Pending apply awaiting confirmation
      tags:
      - apply
  /api/auth/api-keys:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-array_types_APIKey'
          description: OK
      security:
      - BearerAuth: []
      summary: List application API keys
      tags:
      - auth
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/types.CreateAPIKeyRequest'
              description: API key name
              summary: body
        description: API key name
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.Response-types_CreateAPIKeyResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Create an application API key
