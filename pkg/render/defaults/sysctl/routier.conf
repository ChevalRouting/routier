# routier:{{ .Hostname }}
{{- range $k, $v := .Sysctl }}
{{ renderStr $k }} = {{ renderStr $v }}
{{- end }}
{{- if dnsNeedsNonlocalBind }}
net.ipv4.ip_nonlocal_bind = 1
net.ipv6.ip_nonlocal_bind = 1
{{- end }}
{{- if conntrackdNeedsLiberal }}
net.netfilter.nf_conntrack_tcp_be_liberal = 1
{{- end }}
