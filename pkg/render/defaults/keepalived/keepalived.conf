# routier:{{ .Hostname }}
# Generated by routier - do not edit manually
global_defs {
    max_auto_priority
    script_user root root
    enable_script_security
    data_dir /run/keepalived
}
{{ if .HA }}{{ range $v := .HA.VRRP }}
{{- $instName := printf "VI_%s_%d" $v.Interface $v.ID -}}
{{- if $v.Name }}{{- $instName = $v.Name }}{{ end }}
vrrp_instance {{ $instName }} {
    state BACKUP
    interface {{ if $v.Transport }}{{ iface $v.Transport }}{{ else }}{{ iface $v.Interface }}{{ end }}
    virtual_router_id {{ $v.ID }}
    priority {{ if $v.Priority }}{{ $v.Priority }}{{ else }}100{{ end }}
    advert_int 1
    preempt
{{- if $v.VirtualRoutes }}
    virtual_routes {
{{- range $v.VirtualRoutes }}
        {{ . | renderStr }}
{{- end }}
    }
{{- end }}
{{- if $v.TrackInterfaces }}
    track_interface {
{{- range $v.TrackInterfaces }}
        {{ . }}
{{- end }}
    }
{{- end }}
{{- if $v.Password }}
    authentication {
        auth_type PASS
        auth_pass {{ $v.Password }}
    }
{{- end }}
    virtual_ipaddress {
{{- range $v.VIPs }}
        {{ . }}{{ if $v.Transport }} dev {{ iface $v.Interface }}{{ end }}
{{- end }}
    }
{{- if $v.Switchover }}
    notify_backup "{{ $.SelfExe }} switchover"
    notify_master "{{ $.SelfExe }} activate"
{{- end }}
}
{{ end }}{{ end }}
