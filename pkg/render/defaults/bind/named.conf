// routier:{{ .Hostname }} override in /etc/routier/templates/bind/named.conf
{{- with .DNS }}{{- with .Server }}
include "/etc/bind/rndc.key";

controls {
    inet {{ bindControlAddr }} port {{ bindControlPort }} allow { {{ bindControlAddr }}; } keys { "rndc-key"; };
};
{{- if ddnsEnabled }}

key "{{ ddnsKeyName }}" {
    algorithm {{ ddnsKeyAlgorithm }};
    secret "{{ ddnsKeySecret }}";
};
{{- end }}

acl routier_clients {
{{- range bindAllowFrom }}
    {{ . }};
{{- end }}
};

options {
    directory "/var/bind";
    pid-file "/run/named/named.pid";
    statistics-file "{{ bindStatsFile }}";
    version none;
    listen-on port {{ bindPort }} { {{ bindListen4 }} };
{{- if bindListen6 }}
    listen-on-v6 port {{ bindPort }} { {{ bindListen6 }} };
{{- else }}
    listen-on-v6 { none; };
{{- end }}
    allow-query { routier_clients; };
    allow-transfer { none; };
    allow-update { none; };
{{- if bindRecursion }}
    recursion yes;
    allow-recursion { routier_clients; };
{{- else }}
    recursion no;
{{- end }}
{{- if .DNSSEC }}
    dnssec-validation auto;
{{- else }}
    dnssec-validation no;
{{- end }}
{{- if bindValidateExcept }}
    validate-except {
{{- range bindValidateExcept }}
        "{{ . }}";
{{- end }}
    };
{{- end }}
{{- range bindDisableEmptyZones }}
    disable-empty-zone "{{ . }}";
{{- end }}
{{- if bindRecursion }}
{{- if .Upstreams }}
    forwarders {
{{- range .Upstreams }}
        {{ . }};
{{- end }}
    };
    forward only;
{{- end }}
{{- end }}
{{- with .Cache }}
{{- if .Disabled }}
    max-cache-ttl 0;
    max-ncache-ttl 0;
{{- else }}
{{- if .Size }}
    max-cache-size {{ bindSize .Size }};
{{- end }}
{{- if .MinTTL }}
    min-cache-ttl {{ .MinTTL }};
{{- end }}
{{- if .MaxTTL }}
    max-cache-ttl {{ .MaxTTL }};
{{- end }}
{{- if .MaxNegativeTTL }}
    max-ncache-ttl {{ .MaxNegativeTTL }};
{{- end }}
{{- if .ServeExpired }}
    stale-answer-enable yes;
{{- end }}
{{- end }}
{{- end }}
{{- extraLines .Extra "    " }}
};

logging {
    channel routier_log {
        file "{{ bindLog }}" versions 3 size 10m;
        severity info;
        print-time yes;
        print-category yes;
    };
    category default { routier_log; };
{{- if .LogQueries }}
    category queries { routier_log; };
{{- end }}
};
{{- if .Views }}
{{- range .Views }}

view "{{ .Name }}" {
    match-clients {
{{- if .MatchFrom }}
{{- range .MatchFrom }}
        {{ . }};
{{- end }}
{{- else }}
        any;
{{- end }}
    };
{{- if bindViewRecursion . }}
    recursion yes;
    allow-recursion { routier_clients; };
{{- if .Upstreams }}
    forwarders {
{{- range .Upstreams }}
        {{ . }};
{{- end }}
    };
    forward only;
{{- end }}
{{- else }}
    recursion no;
    allow-recursion { none; };
{{- end }}
{{- range .Forward }}

    zone "{{ dnsName .Domain }}" IN {
        type forward;
        forward only;
        forwarders {
{{- range .Servers }}
            {{ . }};
{{- end }}
        };
    };
{{- end }}
{{- range .Zones }}

    zone "{{ dnsName .Name }}" IN {
{{- if .Primaries }}
        type secondary;
        primaries {
{{- range .Primaries }}
            {{ . }};
{{- end }}
        };
        file "{{ bindZoneFile .Name }}";
{{- else }}
        type primary;
        file "{{ bindZoneFile .Name }}";
{{- end }}
{{- extraLines .Extra "        " }}
    };
{{- end }}
{{- extraLines .Extra "    " }}
};
{{- end }}
{{- else }}
{{- range .Forward }}

zone "{{ dnsName .Domain }}" IN {
    type forward;
    forward only;
    forwarders {
{{- range .Servers }}
        {{ . }};
{{- end }}
    };
};
{{- end }}
{{- range .Zones }}

zone "{{ dnsName .Name }}" IN {
{{- if .Primaries }}
    type secondary;
    primaries {
{{- range .Primaries }}
        {{ . }};
{{- end }}
    };
    file "{{ bindZoneFile .Name }}";
{{- else }}
    type primary;
    file "{{ bindZoneFile .Name }}";
{{- if ddnsManagedZone .Name }}
    allow-update { key "{{ ddnsKeyName }}"; };
    allow-transfer { key "{{ ddnsKeyName }}"; };
{{- end }}
{{- if .DNSSEC }}
    dnssec-policy default;
    inline-signing yes;
{{- end }}
{{- end }}
{{- extraLines .Extra "    " }}
};
{{- end }}
{{- end }}
{{- if ddnsEnabled }}
{{- range ddnsUndeclaredZones }}

zone "{{ dnsName . }}" IN {
    type primary;
    file "{{ bindZoneFileName . }}";
    allow-update { key "{{ ddnsKeyName }}"; };
    allow-transfer { key "{{ ddnsKeyName }}"; };
};
{{- end }}
{{- end }}
{{- end }}{{- end }}
