{{- range $name := frrInterfaces }}
{{- $ospf := ospfIface $name }}
{{- $ospf6 := ospf6Iface $name }}
{{- $pbr := pbrPolicy $name }}
!
interface {{ iface $name }}
{{- if $ospf }}
{{- if $ospf.Area }}
 ip ospf area {{ $ospf.Area }}
{{- end }}
{{- if $ospf.Cost }}
 ip ospf cost {{ $ospf.Cost }}
{{- end }}
{{- if $ospf.HelloInterval }}
 ip ospf hello-interval {{ $ospf.HelloInterval }}
{{- end }}
{{- if $ospf.DeadInterval }}
 ip ospf dead-interval {{ $ospf.DeadInterval }}
{{- end }}
{{- if $ospf.NetworkType }}
 ip ospf network {{ $ospf.NetworkType }}
{{- end }}
{{- if $ospf.Priority }}
 ip ospf priority {{ $ospf.Priority }}
{{- end }}
{{- if $ospf.RetransmitInterval }}
 ip ospf retransmit-interval {{ $ospf.RetransmitInterval }}
{{- end }}
{{- if $ospf.TransmitDelay }}
 ip ospf transmit-delay {{ $ospf.TransmitDelay }}
{{- end }}
{{- if $ospf.MTUIgnore }}
 ip ospf mtu-ignore
{{- end }}
{{- if $ospf.BFD }}
 ip ospf bfd
{{- end }}
{{- if eq $ospf.AuthType "md5" }}
 ip ospf authentication message-digest
 ip ospf message-digest-key {{ if $ospf.AuthKeyID }}{{ $ospf.AuthKeyID }}{{ else }}1{{ end }} md5 {{ $ospf.AuthKey }}
{{- else if eq $ospf.AuthType "simple" }}
 ip ospf authentication
 ip ospf authentication-key {{ $ospf.AuthKey }}
{{- end }}
{{- extraLines $ospf.Extra " " }}
{{- end }}
{{- if $ospf6 }}
{{- if $ospf6.Area }}
