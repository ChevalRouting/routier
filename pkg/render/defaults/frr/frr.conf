! routier:{{ .Hostname }} override in /etc/routier/templates/frr/frr.conf
frr version 10.0
frr defaults traditional
hostname {{ .Hostname }}
log syslog informational
service integrated-vtysh-config
!
{{- if bgpNoRIB }}
bgp no-rib
!
{{- end }}
{{- with bfdProfiles }}
bfd
{{- range . }}
 profile {{ .Name }}
{{- if .DetectMultiplier }}
  detect-multiplier {{ .DetectMultiplier }}
{{- end }}
{{- if .ReceiveInterval }}
  receive-interval {{ .ReceiveInterval }}
{{- end }}
{{- if .TransmitInterval }}
  transmit-interval {{ .TransmitInterval }}
{{- end }}
{{- if .MinimumTTL }}
  minimum-ttl {{ .MinimumTTL }}
{{- end }}
{{- if .EchoMode }}
  echo-mode
{{- end }}
{{- if .PassiveMode }}
  passive-mode
{{- end }}
{{- extraLines .Extra "  " }}
 exit
{{- end }}
exit
!
{{- end }}
{{ with .Routing }}
{{- with .BGP }}
router bgp {{ .ASN }}
 bgp router-id {{ .RouterID }}
 bgp log-neighbor-changes
{{- if .NoEBGPRequiresPolicy }}
 no bgp ebgp-requires-policy
{{- end }}
{{- if .NoDefaultIPv4Unicast }}
 no bgp default ipv4-unicast
{{- end }}
{{- if .NoImportCheck }}
 no bgp network import-check
{{- end }}
{{- extraLines .Extra " " }}
{{- range .Neighbors }}
 !
 neighbor {{ .Address }} remote-as {{ .RemoteASN }}
{{- if .Description }}
 neighbor {{ .Address }} description {{ .Description }}
{{- end }}
{{- if .Password }}
 neighbor {{ .Address }} password {{ .Password }}
{{- end }}
{{- if .UpdateSource }}
 neighbor {{ .Address }} update-source {{ .UpdateSource }}
{{- end }}
{{- if .EBGPMultihop }}
 neighbor {{ .Address }} ebgp-multihop {{ .EBGPMultihop }}
{{- end }}
{{- if .DisableConnectedCheck }}
 neighbor {{ .Address }} disable-connected-check
{{- end }}
{{- if .BFD }}
 neighbor {{ .Address }} bfd
{{- if .BFDProfile }}
 neighbor {{ .Address }} bfd profile {{ .BFDProfile }}
{{- end }}
{{- end }}
{{- if .Passive }}
 neighbor {{ .Address }} passive
{{- end }}
{{- if .Shutdown }}
 neighbor {{ .Address }} shutdown
{{- end }}
{{- $naddr := .Address }}
{{- range .Extra }}
 neighbor {{ $naddr }} {{ . }}
{{- end }}
{{- end }}
{{- $bgp := . }}
{{- range bgpAFs . }}
{{- $af := . }}
{{- $family := index $bgp.AddressFamilies $af }}
 !
 address-family {{ $af | afName }}
{{- if $family }}
{{- if $family.DefaultOriginate }}
  default-information originate
{{- end }}
{{- if $family.MaximumPaths }}
  maximum-paths {{ $family.MaximumPaths }}
{{- end }}
{{- if $family.AdvertiseAllVNI }}
  advertise-all-vni
{{- end }}
{{- if $family.AdvertiseDefaultGateway }}
  advertise-default-gw
{{- end }}
{{- if $family.AdvertiseSVIIP }}
  advertise-svi-ip
{{- end }}
{{- range $family.Advertise }}
  advertise {{ . | afName }}
{{- end }}
{{- range $family.RouteTargetImport }}
  route-target import {{ . }}
{{- end }}
{{- range $family.RouteTargetExport }}
  route-target export {{ . }}
{{- end }}
{{- range $family.Networks }}
  network {{ . }}
{{- end }}
{{- range $family.Redistribute }}
  redistribute {{ . }}
{{- end }}
{{- range $family.ImportVRF }}
  import vrf {{ . }}
{{- end }}
{{- if $family.RD }}
  rd vpn export {{ $family.RD }}
{{- end }}
{{- if $family.RTVPNImport }}
  rt vpn import {{ join $family.RTVPNImport " " }}
{{- end }}
{{- if $family.RTVPNExport }}
  rt vpn export {{ join $family.RTVPNExport " " }}
{{- end }}
{{- if $family.LabelVPNExportAuto }}
  label vpn export auto
{{- end }}
{{- if $family.ImportVPN }}
  import vpn
{{- end }}
{{- if $family.ExportVPN }}
  export vpn
{{- end }}
{{- if $family.RouteMapVPNImport }}
  route-map vpn import {{ $family.RouteMapVPNImport }}
{{- end }}
{{- if $family.RouteMapVPNExport }}
  route-map vpn export {{ $family.RouteMapVPNExport }}
{{- end }}
{{- if $family.RouteMapIn }}
  route-map {{ $family.RouteMapIn }} in
{{- end }}
{{- if $family.RouteMapOut }}
  route-map {{ $family.RouteMapOut }} out
{{- end }}
{{- extraLines $family.Extra "  " }}
{{- end }}
{{- range $bgp.Neighbors }}
{{- $addr := .Address }}
{{- $naf := bgpNeighborInAF . $af }}
{{- if $naf }}
{{- if $naf.Disabled }}
  no neighbor {{ $addr }} activate
{{- else }}
  neighbor {{ $addr }} activate
{{- end }}
{{- if $naf.DefaultOriginate }}
  neighbor {{ $addr }} default-originate
{{- end }}
{{- if $naf.SoftReconfiguration }}
  neighbor {{ $addr }} soft-reconfiguration inbound
{{- end }}
{{- if $naf.PrefixListIn }}
  neighbor {{ $addr }} prefix-list {{ $naf.PrefixListIn }} in
{{- end }}
{{- if $naf.PrefixListOut }}
  neighbor {{ $addr }} prefix-list {{ $naf.PrefixListOut }} out
{{- end }}
{{- if $naf.RouteMapIn }}
  neighbor {{ $addr }} route-map {{ $naf.RouteMapIn }} in
{{- end }}
{{- if $naf.RouteMapOut }}
  neighbor {{ $addr }} route-map {{ $naf.RouteMapOut }} out
{{- end }}
{{- if $naf.NextHopSelf }}
  neighbor {{ $addr }} next-hop-self
{{- end }}
{{- if $naf.RouteReflectorClient }}
  neighbor {{ $addr }} route-reflector-client
{{- end }}
{{- if $naf.RemovePrivateAS }}
  neighbor {{ $addr }} remove-private-AS
{{- end }}
{{- if $naf.AllowASIn }}
  neighbor {{ $addr }} allowas-in {{ $naf.AllowASIn }}
{{- end }}
{{- if $naf.Weight }}
  neighbor {{ $addr }} weight {{ $naf.Weight }}
{{- end }}
{{- range $naf.Extra }}
  neighbor {{ $addr }} {{ . }}
{{- end }}
{{- end }}
{{- end }}
 exit-address-family
{{- end }}
exit
!
{{- range $name, $entries := .PrefixLists }}
{{- range $entries }}
ip prefix-list {{ $name }} seq {{ .Seq }} {{ .Action }} {{ .Prefix }}{{ if .GE }} ge {{ .GE }}{{ end }}{{ if .LE }} le {{ .LE }}{{ end }}
{{- end }}
{{- end }}
!
{{- range $name, $entries := .RouteMaps }}
{{- range $entries }}
route-map {{ $name }} {{ .Action }} {{ .Seq }}
{{- range $k, $v := .Match }}
 match {{ $k }} {{ $v }}
{{- end }}
{{- range $k, $v := .Set }}
 set {{ $k }} {{ $v }}
{{- end }}
{{- if .Call }}
 call {{ .Call }}
{{- end }}
{{- if .OnMatch }}
 on-match {{ .OnMatch }}
{{- end }}
{{- if .Continue }}
 continue {{ .Continue }}
{{- end }}
exit
{{- end }}
{{- end }}
{{- end }}
{{- with .OSPF }}
!
router ospf
 ospf router-id {{ .RouterID }}
{{- if .ReferenceBandwidth }}
 auto-cost reference-bandwidth {{ .ReferenceBandwidth }}
{{- end }}
{{- if .Distance }}
 distance {{ .Distance }}
{{- end }}
{{- range .Areas }}
{{- $area := .ID }}
{{- range .Networks }}
 network {{ . }} area {{ $area }}
{{- end }}
{{- if eq .Type "stub" }}
 area {{ .ID }} stub{{ if .StubNoSummary }} no-summary{{ end }}
{{- end }}
{{- if eq .Type "nssa" }}
 area {{ .ID }} nssa
{{- end }}
{{- if eq .Auth "md5" }}
 area {{ .ID }} authentication message-digest
{{- else if eq .Auth "simple" }}
 area {{ .ID }} authentication
{{- end }}
{{- range .Ranges }}
 area {{ $area }} range {{ . }}
{{- end }}
{{- if .DefaultCost }}
 area {{ $area }} default-cost {{ .DefaultCost }}
{{- end }}
{{- extraLines .Extra " " }}
{{- end }}
{{- range .PassiveInterfaces }}
 passive-interface {{ . }}
{{- end }}
{{- range .Redistribute }}
 redistribute {{ . }}
{{- end }}
{{- if .DefaultInformationOriginate }}
 default-information originate
{{- end }}
{{- extraLines .Extra " " }}
exit
{{- end }}
{{- with .OSPF6 }}
!
router ospf6
