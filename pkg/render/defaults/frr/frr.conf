{{- end }}
{{- if eq .Type "stub" }}
 area {{ .ID }} stub{{ if .StubNoSummary }} no-summary{{ end }}
{{- end }}
{{- if eq .Type "nssa" }}
 area {{ .ID }} nssa
{{- end }}
{{- if .DefaultCost }}
