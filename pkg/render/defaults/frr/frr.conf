{{- with .PBR }}
{{- range $name, $group := .NexthopGroups }}
!
nexthop-group {{ $name }}
{{- range .Nexthops }}
 nexthop{{ if .Address }} {{ renderStr .Address }}{{ end }}{{ if .Dev }} {{ renderStr .Dev }}{{ end }}{{ if .NexthopVRF }} nexthop-vrf {{ renderStr .NexthopVRF }}{{ end }}
{{- end }}
exit
{{- end }}
{{- range $name, $entries := .Maps }}
{{- range $entries }}
!
pbr-map {{ $name }} seq {{ .Seq }}
{{- if .MatchSrc }}
 match src-ip {{ .MatchSrc }}
{{- end }}
{{- if .MatchDst }}
 match dst-ip {{ .MatchDst }}
{{- end }}
{{- if .SetNexthopGroup }}
 set nexthop-group {{ .SetNexthopGroup }}
{{- end }}
{{- if .SetNexthop }}
 set nexthop {{ renderStr .SetNexthop }}
{{- end }}
exit
{{- end }}
{{- end }}
{{- end }}
{{ end }}
