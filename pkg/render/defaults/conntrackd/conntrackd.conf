# routier:{{ .Hostname }} - generated by routier, do not edit manually
{{ with .HA }}{{ with .Conntrackd -}}
Sync {
    Mode FTFW {
        DisableExternalCache Off
        CommitTimeout 1800
        PurgeTimeout 5
    }
    UDP {
        {{ if contains .Address ":" }}IPv6_address{{ else }}IPv4_address{{ end }} {{ .Address }}
        {{- range .PeerIPs }}
        {{ if contains . ":" }}IPv6_Destination_Address{{ else }}IPv4_Destination_Address{{ end }} {{ . }}
        {{- end }}
        Port {{ if .Port }}{{ .Port }}{{ else }}3780{{ end }}
        Interface {{ iface .Interface }}
        SndSocketBuffer 1249280
        RcvSocketBuffer 1249280
        Checksum on
    }
}

General {
    HashSize 32768
    HashLimit 131072
    LogFile /var/log/conntrackd.log
    Syslog on
    LockFile /var/lock/conntrackd.lock
    UNIX {
        Path /var/run/conntrackd.ctl
    }
}
{{ end }}{{ end }}
