name: nightly

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: false

env:
  ALPINE_IMAGE: docker.io/library/alpine:3.23

jobs:
  build:
    runs-on: [self-hosted, sn]
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      arch: ${{ steps.v.outputs.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore signing key
        run: |
          printf '%s\n' "${{ secrets.ROUTIER_RSA }}" > routier.rsa
          printf '%s\n' "${{ secrets.ROUTIER_RSA_PUB }}" > routier.rsa.pub
          chmod 600 routier.rsa
          chmod 644 routier.rsa.pub

      - name: Compute version
        id: v
        run: |
          commit="$(git rev-parse --short HEAD)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            channel=stable
            version="${GITHUB_REF_NAME#v}"
          else
            channel=nightly
            base="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            version="${base#v}_git$(git rev-list --count HEAD)"
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "building ${version} (${commit}) for the ${channel} channel on $(uname -m)"

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.53.1

      - name: Build packages
        run: task apk VERSION='${{ steps.v.outputs.version }}' PODMAN_TTY=

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ROUTIER_STATIC_SSH_KEY }}" > ~/.ssh/routier_static
          chmod 600 ~/.ssh/routier_static
          printf '%s\n' "${{ secrets.ROUTIER_STATIC_KNOWN_HOSTS }}" > ~/.ssh/routier_static_known_hosts

      - name: Publish to the ${{ steps.v.outputs.channel }} channel
        env:
          REPO_TARGET: "${{ vars.ROUTIER_STATIC_USER }}@${{ vars.ROUTIER_STATIC_HOST }}:${{ vars.ROUTIER_REPO_PATH || '/srv/routier/repo' }}"
          CHANNEL: ${{ steps.v.outputs.channel }}
          VERSION: ${{ steps.v.outputs.version }}
          ARCH: ${{ steps.v.outputs.arch }}
          CONTAINER: podman
        run: |
          SSH_KEY="$HOME/.ssh/routier_static" KNOWN_HOSTS="$HOME/.ssh/routier_static_known_hosts" \
            sh scripts/repo-publish.sh

      - name: Clean up secrets
        if: always()
        run: rm -f ~/.ssh/routier_static routier.rsa

  docs:
    needs: build
    runs-on: [self-hosted, sn]
    steps:
      - uses: actions/checkout@v5

      - name: Build website
        run: |
          podman run --rm \
            --userns=keep-id \
            -v "$PWD/website:/src:z" \
            -v "$PWD/docs:/docs:z" \
            -w /src \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm-cache \
            -e SITE_URL=https://routier.cloud \
            -e SITE_BASE_URL=/ \
            -e REPO_URL=https://repo.routier.cloud \
            -e SITE_COMMIT='${{ needs.build.outputs.commit }}' \
            -e SITE_VERSION='${{ needs.build.outputs.version }}' \
            docker.io/library/node:24-bookworm-slim \
            sh -c "npm ci --no-audit --no-fund && \
              sh scripts/version-dev.sh && \
              npm run build"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ROUTIER_STATIC_SSH_KEY }}" > ~/.ssh/routier_static
          chmod 600 ~/.ssh/routier_static
          printf '%s\n' "${{ secrets.ROUTIER_STATIC_KNOWN_HOSTS }}" > ~/.ssh/routier_static_known_hosts

      - name: Deploy over rsync
        env:
          TARGET: "${{ vars.ROUTIER_STATIC_USER }}@${{ vars.ROUTIER_STATIC_HOST }}:${{ vars.ROUTIER_STATIC_PATH || '/srv/routier/site' }}/"
        run: |
          podman run --rm \
            -e TARGET \
            -v "$PWD/website/build:/build:ro" \
            -v "$HOME/.ssh:/ssh:ro" \
            "$ALPINE_IMAGE" \
            sh -c 'apk add --no-cache rsync openssh-client >/dev/null && \
              rsync -az --delete \
                -e "ssh -i /ssh/routier_static -o IdentitiesOnly=yes -o UserKnownHostsFile=/ssh/routier_static_known_hosts" \
                /build/ "$TARGET"'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/routier_static
